.pp{width:40px;height:66px}.pp.h{fill:#3F5C8A}.pp.w{fill:#9A3D4A}
.hh{width:32px;height:29px;fill:none;stroke:#5E6866;stroke-width:2.4}.hh.on{fill:#C62F3E;stroke:#C62F3E}
.flow{position:absolute;right:32px;width:636px;top:280px;display:flex;justify-content:center;pointer-events:none}
