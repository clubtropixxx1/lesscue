<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:SM;src:url(fonts/shippori-mincho-japanese-800-normal.woff2);font-weight:800}
@font-face{font-family:ZK;src:url(fonts/zen-kaku-gothic-new-japanese-700-normal.woff2);font-weight:700}
@font-face{font-family:ZK;src:url(fonts/zen-kaku-gothic-new-japanese-500-normal.woff2);font-weight:500}
html,body{margin:0}
body{width:1200px;height:630px;background:#F2F3EF;color:#1D2426;font-family:ZK;position:relative;overflow:hidden}
.top{position:absolute;left:0;top:0;right:0;height:10px;background:#364059}.top i{position:absolute;left:0;top:0;width:180px;height:10px;background:#C62F3E}
h1{position:absolute;left:64px;top:70px;margin:0;font-family:SM;font-weight:800;font-size:62px;line-height:1.3;color:#364059;letter-spacing:.02em}
.kick{position:absolute;left:64px;top:372px;padding:10px 30px;border-radius:999px;background:#C62F3E;color:#fff;font-size:34px;font-weight:700;letter-spacing:.06em;box-shadow:0 8px 20px rgba(198,47,62,.25)}
.brand{position:absolute;left:66px;bottom:40px;font-family:SM;font-weight:800;font-size:34px}.brand span{color:#4F5D8C}
.url{position:absolute;left:68px;bottom:18px;font-size:16px;color:#5E6866;letter-spacing:.06em}

.list{position:absolute;right:60px;top:70px;width:520px;display:flex;flex-direction:column;gap:14px}
.t{height:104px;border-radius:16px;display:flex;align-items:center;padding:0 34px;color:#fff;font-family:SM;font-weight:800;font-size:46px;letter-spacing:.04em;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.t small{margin-left:auto;font-family:ZK;font-weight:700;font-size:18px;opacity:.85;letter-spacing:.04em}
.t1{background:linear-gradient(135deg,#6A3550,#4A2238)}
.t2{background:linear-gradient(135deg,#3B4670,#2A3150)}
.t3{background:linear-gradient(135deg,#2F5A4E,#21423A)}
.t4{background:linear-gradient(135deg,#454B50,#30353A)}
</style></head><body><div class="top"><i></i></div>

<div class="list">
<div class="t t1">妻拒否型</div><div class="t t2">夫拒否型</div><div class="t t3">流動的不仲型</div><div class="t t4">完全不仲型</div>
</div>
