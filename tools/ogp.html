<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:SM;src:url(fonts/shippori-mincho-japanese-800-normal.woff2);font-weight:800}
@font-face{font-family:ZK;src:url(fonts/zen-kaku-gothic-new-japanese-700-normal.woff2);font-weight:700}
@font-face{font-family:ZK;src:url(fonts/zen-kaku-gothic-new-japanese-500-normal.woff2);font-weight:500}
html,body{margin:0}
body{width:1200px;height:630px;background:#F2F3EF;font-family:ZK;color:#1D2426;position:relative;overflow:hidden}
.top{position:absolute;left:0;top:0;right:0;height:10px;background:#364059}
.top i{position:absolute;left:0;top:0;width:180px;height:10px;background:#C62F3E}
.card{position:absolute;left:72px;top:58px;right:72px;bottom:100px;background:#fff;border:1px solid #D9DDD6;border-radius:24px;padding:64px 72px;display:flex;flex-direction:column;justify-content:center}
.catch{color:#4F5D8C;font-weight:500;font-size:34px;letter-spacing:.04em}
.logo{font-family:SM;font-weight:800;font-size:128px;line-height:1.15;letter-spacing:.02em;margin:8px 0 18px}
.logo span{color:#4F5D8C}
.sub{font-weight:700;font-size:42px;letter-spacing:.02em}
.foot{position:absolute;right:72px;bottom:34px;font-size:24px;color:#5E6866;font-weight:500;letter-spacing:.06em}
.chips{position:absolute;left:72px;bottom:32px;display:flex;gap:12px}
.chips b{font-weight:500;font-size:22px;color:#364059;border:1.5px solid #364059;border-radius:999px;padding:2px 16px}
</style></head><body><div class="top"><i></i></div>
<div class="card"><div class="catch">―私はレス山さんを救いたい―</div><div class="logo">レスられ<span>総研</span></div><div class="sub">セックスレスのお悩みと解消法のデータベース</div></div>
<div class="chips"><b>簡単診断</b><b>型別の記事</b><b>調査データ</b></div><div class="foot">lesscue.com</div>
</body></html>
